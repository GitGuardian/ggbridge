{{- $deploymentCount := int (default 0 .Values.deploymentCount) -}}
{{- $trafficRouting := eq (include "ggbridge.server.trafficRouting.enabled" .) "true" -}}
{{- $tlsMode := lower (default "" .Values.tls.mode) -}}

{{- if eq .Values.mode "server" -}}

  {{- if and (gt $deploymentCount 1) (not $trafficRouting) -}}
    {{- fail (printf "\n\nggbridge: deploymentCount is %d but no layer-7 exposure method is enabled.\n\nHigh availability relies on path routing: every client index dials the same hostname and is distinguished only by a /<index> path prefix, and each server pod only accepts websocket upgrades on its own prefix. A Service cannot route by path, so clients would be rejected whenever they reach a pod of a different index.\n\nEnable one of server.ingress, server.gateway or server.istio, or set deploymentCount to 1." $deploymentCount) -}}
  {{- end -}}

  {{- if and .Values.tls.enabled .Values.server.ingress.enabled (eq $tlsMode "mutual") (empty .Values.server.ingress.controller) -}}
    {{- fail "\n\nggbridge: tls.mode is 'mutual' and server.ingress is enabled, but server.ingress.controller is not set.\n\nClient-certificate verification is configured per ingress controller (traefik needs a TLSOption resource, nginx needs auth-tls annotations). With an empty controller the chart emits neither, so the server would terminate TLS without ever verifying client certificates -- mutual TLS would not be enforced.\n\nSet server.ingress.controller to 'traefik' or 'nginx', or expose the server with server.gateway or server.istio instead." -}}
  {{- end -}}

  {{- if and .Values.tls.enabled (eq $tlsMode "simple") (not $trafficRouting) -}}
    {{- fail "\n\nggbridge: tls.mode is 'simple' but no layer-7 exposure method is enabled.\n\nWithout one, the server pod terminates TLS itself and always starts wstunnel with --tls-client-ca-certs, which enables mTLS. tls.mode is only honoured by the ingress, gateway and istio templates, so 'simple' would be silently ignored and the tunnel would still require a client certificate.\n\nSet tls.mode to 'mutual' to match the actual behaviour, or enable server.ingress, server.gateway or server.istio." -}}
  {{- end -}}

{{- else -}}

  {{- if and .Values.tls.enabled .Values.tls.autoGenerated (not .Values.tls.existingSecret) (not .Values.tls.certManager.enabled) -}}
    {{- fail "\n\nggbridge: tls.autoGenerated is only supported with mode 'server'.\n\nCertificate generation is skipped for clients, so the chart would emit a TLS secret containing empty certificate and key values and the pod would fail to establish the tunnel.\n\nProvide the client certificate with tls.existingSecret, or set the tls.caCrt, tls.crt and tls.key values." -}}
  {{- end -}}

{{- end -}}
