suite: rejected value combinations
templates:
  - templates/validations.yaml
tests:
  - it: rejects HA without a layer-7 exposure method
    set:
      mode: server
      tls.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "deploymentCount is 3 but no layer-7 exposure method is enabled"

  - it: rejects two replicas without a layer-7 exposure method
    set:
      mode: server
      deploymentCount: 2
      tls.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "deploymentCount is 2 but no layer-7 exposure method is enabled"

  - it: rejects mutual TLS on an ingress with no controller set
    set:
      mode: server
      tls.enabled: true
      server.ingress.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "server.ingress.controller is not set"

  - it: rejects tls.mode simple on the direct-TLS path
    set:
      mode: server
      deploymentCount: 1
      tls.enabled: true
      tls.mode: simple
    asserts:
      - failedTemplate:
          errorPattern: "tls.mode is 'simple' but no layer-7 exposure method is enabled"

  - it: rejects autoGenerated certificates on a client
    set:
      mode: client
      tls.enabled: true
      tls.autoGenerated: true
    asserts:
      - failedTemplate:
          errorPattern: "tls.autoGenerated is only supported with mode 'server'"

  - it: rejects a caBundle.image override
    set:
      caBundle.image.tag: unstable-shell
    asserts:
      - failedTemplate:
          errorPattern: "caBundle.image is set but no longer exists"
