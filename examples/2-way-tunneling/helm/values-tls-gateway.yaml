---
# The bridge URL shown in the dashboard:
#   US: <id>.ggbridge.gitguardian.com
#   EU: <id>.ggbridge.eu1.gitguardian.com
hostname: <id>.ggbridge.gitguardian.com

tls:
  enabled: true
  existingSecret: ggbridge-client-crt
  existingSecretKeys:
    caCrt: ca.crt
    crt: tls.crt
    key: tls.key

client:
  tunnels:
    tls:
      enabled: true

proxy:
  tunnels:
    tls:
      gateway:
        enabled: true
        gateway:
          # This will create the gateway resource, you can disable it if you want to manage it on your own.
          create: true
          # This will set the gatewayClass of the Gateway
          className: "my-gatewayclass"
          # Defaults to the US hosts. For the EU region:
          # listeners:
          #   - hostname: api.eu1.gitguardian.com
          #   - hostname: hook.eu1.gitguardian.com
